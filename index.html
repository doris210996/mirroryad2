<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yad 1.5 — Smart Real Estate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #111827;
            color: #f9fafb;
            overflow-x: hidden;
            direction: rtl;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,107,0,0.35); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,107,0,0.55); }

        /* ── Header ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(17,24,39,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, #FF6B00, #FF9500, #FFB347) 1;
            padding: 16px 24px;
            text-align: center;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            direction: ltr;
        }
        .header .subtitle {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ── Mode Switcher ── */
        .mode-switcher {
            position: sticky;
            top: 87px;
            z-index: 99;
            background: rgba(17,24,39,0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,165,0,0.12);
            padding: 12px 24px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .mode-btn {
            padding: 10px 24px;
            background: rgba(255,255,255,0.04);
            color: #9ca3af;
            border: 1px solid rgba(255,165,0,0.15);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .mode-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,165,0,0.3);
            color: #f9fafb;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(255,107,0,0.4);
        }

        /* ── Container ── */
        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* ── Search Panel Card ── */
        .search-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,165,0,0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(8px);
        }

        /* ── Form ── */
        .re-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 130px;
        }
        .form-group label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .form-group select,
        .form-group input {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,165,0,0.15);
            background: rgba(255,255,255,0.06);
            color: #f9fafb;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            direction: rtl;
        }
        .form-group select:focus,
        .form-group input:focus {
            border-color: #FF6B00;
            box-shadow: 0 0 0 3px rgba(255,107,0,0.15);
        }
        .form-group select option {
            background: #1f2937;
            color: #f9fafb;
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.25); }
        .form-group input[type="number"] { direction: ltr; text-align: right; }

        /* ── Tom Select Dark Theme Override ── */
        .ts-wrapper { width: 100%; }
        .ts-wrapper .ts-control {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,165,0,0.15);
            background: rgba(255,255,255,0.06);
            color: #f9fafb;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            box-shadow: none;
            direction: rtl;
            min-height: 0;
        }
        .ts-wrapper .ts-control input { color: #f9fafb !important; }
        .ts-wrapper .ts-control input::placeholder { color: rgba(255,255,255,0.25) !important; }
        .ts-wrapper.focus .ts-control {
            border-color: #FF6B00;
            box-shadow: 0 0 0 3px rgba(255,107,0,0.15);
        }
        .ts-wrapper .ts-dropdown {
            background: #1f2937;
            border: 1px solid rgba(255,165,0,0.25);
            border-top: none;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            margin-top: 0;
        }
        .ts-wrapper .ts-dropdown .option {
            padding: 8px 14px;
            color: #f9fafb;
            font-size: 0.88rem;
        }
        .ts-wrapper .ts-dropdown .option:hover,
        .ts-wrapper .ts-dropdown .active {
            background: rgba(255,165,0,0.15);
            color: #f9fafb;
        }
        .ts-wrapper .ts-dropdown .ts-dropdown-content::-webkit-scrollbar { width: 6px; }
        .ts-wrapper .ts-dropdown .ts-dropdown-content::-webkit-scrollbar-thumb { background: rgba(255,165,0,0.3); border-radius: 3px; }
        .ts-wrapper .ts-control .item { color: #f9fafb; }

        /* ── Action Buttons ── */
        .re-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.search-btn {
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            color: white;
            min-width: 100px;
        }
        button.search-btn:hover {
            box-shadow: 0 4px 16px rgba(255,107,0,0.35);
            transform: translateY(-1px);
        }
        button.refresh-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,165,0,0.15);
            color: #9ca3af;
        }
        button.refresh-btn:hover {
            border-color: rgba(255,165,0,0.3);
            color: #f9fafb;
        }
        button.refresh-btn.refresh-active {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            border-color: transparent;
        }
        button.cancel {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #9ca3af;
        }
        button.cancel:hover {
            border-color: rgba(239,68,68,0.4);
            color: #ef4444;
        }

        /* ── Info Bar ── */
        .re-info-bar {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            padding: 10px 16px;
            margin-bottom: 12px;
            background: rgba(255,165,0,0.06);
            border: 1px solid rgba(255,165,0,0.1);
            border-radius: 10px;
            font-size: 0.78rem;
            color: #9ca3af;
        }
        .re-info-bar span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .re-info-bar .info-value {
            color: #FFB347;
            font-weight: 600;
        }

        /* ── Results ── */
        .re-results {
            max-height: 600px;
            overflow-y: auto;
            padding-left: 4px;
        }

        /* ── Listing Card ── */
        .re-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,165,0,0.06);
            border-right: 3px solid transparent;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 10px;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }
        .re-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            border-right-color: #FF6B00;
            background: rgba(255,255,255,0.06);
        }

        .re-item-info {
            flex: 1;
            min-width: 0;
        }
        .re-item-badges {
            margin-bottom: 6px;
            display: flex;
            gap: 6px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .badge.new { background: rgba(16,185,129,0.2); color: #10b981; }
        .badge.updated { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .badge.broker { background: rgba(239,68,68,0.2); color: #ef4444; }
        .badge.yad2 { background: rgba(255,165,0,0.2); color: #FFB347; }
        .badge.facebook { background: rgba(59,130,246,0.2); color: #3b82f6; }

        .re-item-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .tag-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.62rem;
            font-weight: 500;
            background: rgba(139,92,246,0.15);
            color: #a78bfa;
            white-space: nowrap;
        }

        /* AI Analysis */
        .ai-btn {
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(139,92,246,0.3);
            background: rgba(139,92,246,0.1);
            color: #a78bfa;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
        }
        .ai-btn:hover {
            background: rgba(139,92,246,0.2);
            border-color: rgba(139,92,246,0.5);
        }
        .ai-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .ai-btn.loading { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .sentiment-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            margin-top: 6px;
        }
        .sentiment-badge.positive { background: rgba(16,185,129,0.2); color: #10b981; }
        .sentiment-badge.negative { background: rgba(239,68,68,0.2); color: #ef4444; }
        .sentiment-badge.neutral { background: rgba(156,163,175,0.2); color: #9ca3af; }
        .ai-keywords {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .ai-keyword {
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.58rem;
            background: rgba(255,165,0,0.1);
            color: #FFB347;
        }

        .re-item-type {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f9fafb;
            margin-bottom: 2px;
        }
        .re-item-address {
            font-size: 0.82rem;
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .re-item-details {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .re-item-details span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .re-item-updated {
            font-size: 0.72rem;
            color: rgba(156,163,175,0.6);
        }

        .re-item-price-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .re-price {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            direction: ltr;
        }

        /* ── Stats Bar ── */
        .re-stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .stat {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 500;
            background: rgba(255,255,255,0.06);
            color: #9ca3af;
            white-space: nowrap;
            direction: ltr;
        }
        .stat.deal-good {
            background: rgba(16,185,129,0.15);
            color: #10b981;
        }
        .stat.deal-bad {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
        }

        /* ── Status / Spinner ── */
        .re-status {
            text-align: center;
            color: #9ca3af;
            padding: 32px 12px;
            font-size: 0.9rem;
        }
        .re-status.loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255,107,0,0.15);
            border-top-color: #FF6B00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Mobile Filter Toggle ── */
        .mobile-filter-toggle {
            display: none;
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mobile-filter-toggle:active {
            transform: scale(0.98);
        }
        .mobile-filter-toggle .toggle-icon {
            display: inline-block;
            transition: transform 0.3s;
            margin-left: 8px;
        }
        .mobile-filter-toggle.active .toggle-icon {
            transform: rotate(180deg);
        }

        /* ── Sticky Search Button (Mobile) ── */
        .sticky-search-mobile {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            padding: 16px 40px;
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(255,107,0,0.5);
            cursor: pointer;
            transition: all 0.2s;
        }
        .sticky-search-mobile:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            /* Header */
            .header {
                padding: 14px 16px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .header .subtitle {
                font-size: 0.75rem;
            }

            /* Container */
            .container {
                padding: 16px 12px 80px;
            }

            /* Search Panel */
            .search-panel {
                padding: 18px;
                border-radius: 12px;
            }

            /* Mobile Filter Toggle */
            .mobile-filter-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Form - Hidden by default on mobile */
            .re-form {
                display: none;
                animation: slideDown 0.3s ease-out;
            }
            .re-form.mobile-visible {
                display: flex;
            }
            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Form Layout */
            .form-row {
                flex-direction: column;
                gap: 14px;
            }
            .form-group {
                min-width: 100%;
            }
            .form-group label {
                font-size: 0.8rem;
                margin-bottom: 8px;
            }
            .form-group select,
            .form-group input {
                padding: 14px 16px;
                font-size: 1rem;
                border-radius: 12px;
            }

            /* Buttons - Larger touch targets */
            button {
                padding: 14px 24px;
                font-size: 0.95rem;
                border-radius: 12px;
                min-height: 48px;
            }
            button.search-btn {
                width: 100%;
                font-size: 1.05rem;
            }

            /* Actions */
            .re-actions {
                flex-direction: column;
                gap: 12px;
            }
            .re-actions button {
                width: 100%;
            }

            /* Info Bar - Stack vertically */
            .re-info-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                font-size: 0.8rem;
                padding: 12px 14px;
            }

            /* Results */
            .re-results {
                max-height: none;
                padding-left: 0;
            }

            /* Listing Cards */
            .re-item {
                flex-direction: column;
                padding: 16px;
                gap: 12px;
                border-radius: 14px;
                margin-bottom: 12px;
            }
            .re-item:active {
                transform: scale(0.98);
            }

            /* Badges - Larger on mobile */
            .badge {
                padding: 5px 12px;
                font-size: 0.7rem;
            }
            .re-item-badges {
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 10px;
            }

            /* Card Content */
            .re-item-type {
                font-size: 1.05rem;
                margin-bottom: 6px;
            }
            .re-item-address {
                font-size: 0.9rem;
                margin-bottom: 10px;
            }
            .re-item-details {
                font-size: 0.85rem;
                gap: 14px;
                flex-wrap: wrap;
            }
            .re-item-updated {
                font-size: 0.75rem;
                margin-top: 4px;
            }

            /* Price - Align left on mobile */
            .re-item-price-col {
                align-items: flex-start;
                width: 100%;
            }
            .re-price {
                font-size: 1.5rem;
            }

            /* Stats */
            .re-stats {
                gap: 6px;
                margin-top: 12px;
                padding-top: 12px;
            }
            .stat {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            /* Tags */
            .tag-pill {
                padding: 4px 10px;
                font-size: 0.68rem;
            }

            /* AI Button */
            .ai-btn {
                padding: 8px 16px;
                font-size: 0.75rem;
                margin-top: 8px;
            }

            /* Sentiment Badge */
            .sentiment-badge {
                padding: 5px 12px;
                font-size: 0.7rem;
            }

            /* Sticky Search Button */
            .sticky-search-mobile {
                display: block;
            }

            /* Status */
            .re-status {
                padding: 40px 16px;
                font-size: 0.95rem;
            }

            /* Checkboxes - Larger touch targets */
            input[type="checkbox"] {
                width: 20px !important;
                height: 20px !important;
            }

            /* Particle background - Reduce on mobile */
            canvas {
                opacity: 0.4;
            }
        }

        /* Extra small devices */
        @media (max-width: 380px) {
            .header h1 {
                font-size: 1.4rem;
            }
            .container {
                padding: 12px 10px 80px;
            }
            .search-panel {
                padding: 14px;
            }
            .re-item {
                padding: 14px;
            }
            .re-price {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>

    <header class="header">
        <h1>Yad 1.5</h1>
        <p class="subtitle">חיפוש נדל"ן חכם עם סינון מתקדם</p>
    </header>

    <!-- Mode Switcher -->
    <div class="mode-switcher">
        <button class="mode-btn active" data-mode="smart-leads" onclick="switchMode('smart-leads')">
            🔍 Smart Leads
        </button>
        <button class="mode-btn" data-mode="deep-analysis" onclick="switchMode('deep-analysis')">
            📊 ניתוח מעמיק
        </button>
    </div>

    <div class="container">
        <!-- Smart Leads Panel -->
        <div id="smart-leads-panel" class="mode-panel">
        <div class="search-panel">
            <button class="mobile-filter-toggle" onclick="toggleMobileFilters()">
                <span class="toggle-icon">▼</span>
                <span>סינון וחיפוש</span>
            </button>
            <div class="re-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reDealType">סוג עסקה</label>
                        <select id="reDealType">
                            <option value="rent">השכרה</option>
                            <option value="forsale">מכירה</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:2; min-width: 220px;">
                        <label for="reLocation">שכונה</label>
                        <select id="reLocation" placeholder="הקלידו שם שכונה..."></select>
                    </div>
                    <div class="form-group" style="min-width: 180px;">
                        <label>מקורות</label>
                        <div style="display: flex; gap: 12px; align-items: center; padding: 10px 0;">
                            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0;">
                                <input type="checkbox" id="sourceYad2" checked style="cursor: pointer; width: 16px; height: 16px;">
                                <span style="font-size: 0.88rem; font-weight: 500;">Yad2</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0;">
                                <input type="checkbox" id="sourceFacebook" checked style="cursor: pointer; width: 16px; height: 16px;">
                                <span style="font-size: 0.88rem; font-weight: 500;">פייסבוק</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="reMinPrice">מחיר מינימום</label>
                        <input type="number" id="reMinPrice" placeholder="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="reMaxPrice">מחיר מקסימום</label>
                        <input type="number" id="reMaxPrice" placeholder="10,000" value="10000">
                    </div>
                    <div class="form-group">
                        <label for="reMinSqm">מ"ר מינימום</label>
                        <input type="number" id="reMinSqm" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="reMaxSqm">מ"ר מקסימום</label>
                        <input type="number" id="reMaxSqm" placeholder="ללא הגבלה">
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <label>&nbsp;</label>
                        <button class="search-btn" onclick="reSearch()">חיפוש</button>
                    </div>
                </div>
            </div>
            <div class="re-actions">
                <button id="reRefreshBtn" class="refresh-btn" onclick="reToggleRefresh()">רענון אוטומטי: כבוי</button>
                <button class="cancel" onclick="reCancel()">ביטול</button>
            </div>
        </div>

        <div id="reInfoBar"></div>

        <div id="reResults" class="re-results">
            <div class="re-status">הזינו קריטריונים ולחצו חיפוש</div>
        </div>
        </div>
        <!-- End Smart Leads Panel -->

        <!-- Deep Analysis Panel -->
        <div id="deep-analysis-panel" class="mode-panel" style="display: none;">
            <div class="search-panel">
                <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; color: #FF9500;">ניתוח מעמיק</h2>
                <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 20px; line-height: 1.5;">
                    הזינו קישור למודעה ביד2 או כתובת מלאה לקבלת ניתוח מעמיק מבוסס עסקאות קודמות באזור
                    <br><span style="font-size: 0.75rem; color: #6b7280;">💡 הנתונים כוללים דוגמאות להמחשה - לנתונים ממשיים נדרש אישור API</span>
                </p>
                <div class="re-form">
                    <div class="form-group">
                        <label for="daInput">קישור למודעה או כתובת</label>
                        <input type="text" id="daInput" placeholder="הדביקו קישור ליד2 או הקלידו כתובת מלאה">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="daRooms">מספר חדרים</label>
                            <input type="number" id="daRooms" placeholder="3" step="0.5" min="0">
                        </div>
                        <div class="form-group" style="justify-content: flex-end;">
                            <label>&nbsp;</label>
                            <button class="search-btn" onclick="deepAnalyze()">נתח נכס</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="daInfoBar"></div>

            <div id="daResults" class="re-results">
                <div class="re-status">הזינו קישור או כתובת ומספר חדרים לניתוח מעמיק</div>
            </div>
        </div>
        <!-- End Deep Analysis Panel -->
    </div>

    <!-- Sticky Search Button (Mobile) -->
    <button class="sticky-search-mobile" onclick="reSearch()">🔍 חיפוש</button>

    <script>
        let reSearchId = null;
        let reRefreshInterval = null;

        // Neighborhood → city mapping loaded from server
        let neighborhoodCityMap = {};

        // Mode switching
        function switchMode(mode) {
            // Update button states
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            // Show/hide panels
            document.getElementById('smart-leads-panel').style.display =
                mode === 'smart-leads' ? 'block' : 'none';
            document.getElementById('deep-analysis-panel').style.display =
                mode === 'deep-analysis' ? 'block' : 'none';
        }

        // Mobile filter toggle
        function toggleMobileFilters() {
            const form = document.querySelector('.re-form');
            const toggle = document.querySelector('.mobile-filter-toggle');
            form.classList.toggle('mobile-visible');
            toggle.classList.toggle('active');
        }

        function reUpdateInfoBar(data) {
            const bar = document.getElementById('reInfoBar');
            if (!data || !data.items || data.items.length === 0) {
                bar.innerHTML = '';
                return;
            }
            const fetchTime = data.fetchTime != null ? data.fetchTime + ' שניות' : '\u2014';
            const totalItems = data.items.length;
            const avgCount = data.avgSampleCount || 0;
            const totalPages = data.total_pages || '\u2014';
            const yad2Count = data.sources?.yad2 || 0;
            const fbCount = data.sources?.facebook || 0;
            const errors = data.errors || {};
            const errorMsg = Object.keys(errors).length > 0
                ? `<span style="color:#ef4444;">שגיאות: ${Object.keys(errors).join(', ')}</span>`
                : '';
            bar.innerHTML = `<div class="re-info-bar">
                <span>זמן שליפה: <span class="info-value">${fetchTime}</span></span>
                <span>תוצאות: <span class="info-value">${totalItems}</span></span>
                <span>Yad2: <span class="info-value">${yad2Count}</span></span>
                <span>פייסבוק: <span class="info-value">${fbCount}</span></span>
                <span>עמודים שנסרקו: <span class="info-value">${Math.min(totalPages, 20)} / ${totalPages}</span></span>
                <span>ממוצע מחושב על: <span class="info-value">${avgCount} נכסים</span></span>
                ${errorMsg}
            </div>`;
        }

        // ── Tom Select — neighborhood-first picker ──
        let locationSelect;

        locationSelect = new TomSelect('#reLocation', {
            create: false,
            maxOptions: 200,
            sortField: { field: 'text', direction: 'asc' },
            optgroupField: 'group',
            optgroupLabelField: 'label',
            optgroupValueField: 'id',
            render: {
                optgroup_header(data) {
                    return '<div style="padding:6px 14px;font-size:0.72rem;font-weight:700;color:#FF9500;border-bottom:1px solid rgba(255,165,0,0.1);">' + data.label + '</div>';
                },
            },
        });

        // Load neighborhoods on page load
        (async function loadLocations() {
            try {
                const res = await fetch('/api/locations');
                const data = await res.json(); // { city: [neighborhood, ...], ... }
                // Build reverse map: neighborhood → [cities]
                const hoodToCities = {};
                for (const [city, hoods] of Object.entries(data)) {
                    locationSelect.addOptionGroup(city, { label: city });
                    for (const hood of hoods) {
                        locationSelect.addOption({ value: hood, text: hood, group: city });
                        if (!hoodToCities[hood]) hoodToCities[hood] = [];
                        hoodToCities[hood].push(city);
                    }
                }
                neighborhoodCityMap = hoodToCities;
                locationSelect.refreshOptions(false);
            } catch (e) { /* ignore */ }
        })();

        function reRenderItems(items) {
            const container = document.getElementById('reResults');
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="re-status">לא נמצאו תוצאות</div>';
                return;
            }
            container.innerHTML = items.map(item => {
                let badges = [];
                // Source badge (always first)
                if (item.source === 'facebook') {
                    badges.push('<span class="badge facebook">פייסבוק</span>');
                } else {
                    badges.push('<span class="badge yad2">Yad2</span>');
                }
                // Status badges
                if (item.status === 'new') badges.push('<span class="badge new">חדש</span>');
                else if (item.status === 'updated') badges.push('<span class="badge updated">עודכן</span>');
                // Broker badge
                if (item.isBroker || item.broker) {
                    badges.push('<span class="badge broker">תיווך' + (item.agencyName ? ' — ' + item.agencyName : '') + '</span>');
                }
                let badgeHtml = badges.length ? '<div class="re-item-badges">' + badges.join('') + '</div>' : '';

                let tagsHtml = '';
                if (item.tags && item.tags.length) {
                    tagsHtml = '<div class="re-item-tags">' + item.tags.map(t => `<span class="tag-pill">${t}</span>`).join('') + '</div>';
                }

                let statsHtml = '';
                if (item.pricePerSqm) {
                    const fmt = n => n ? n.toLocaleString() : '\u2014';
                    const avg = item.avgPricePerSqmNeighborhood || item.avgPricePerSqmFiltered;
                    let dealClass = '';
                    if (avg) dealClass = item.pricePerSqm <= avg ? 'deal-good' : 'deal-bad';
                    statsHtml = `<div class="re-stats">
                        <span class="stat ${dealClass}">${fmt(item.pricePerSqm)} /מ"ר</span>
                        ${item.avgPricePerSqmFiltered ? `<span class="stat">ממוצע מסונן: ${fmt(item.avgPricePerSqmFiltered)} /מ"ר</span>` : ''}
                        ${item.avgPricePerSqmNeighborhood ? `<span class="stat">ממוצע שכונה: ${fmt(item.avgPricePerSqmNeighborhood)} /מ"ר</span>` : ''}
                    </div>`;
                }

                const street = item.street || '';
                const neighborhood = item.neighborhood ? ', ' + item.neighborhood : '';
                const settlement = item.settlement || item.city || '';

                // For Facebook items, format details differently
                let detailsHtml = '';
                if (item.source === 'facebook') {
                    // Show parsed fields from description
                    const roomsText = item.rooms || '\u2014';
                    const sqmText = item.sqm || '\u2014';
                    detailsHtml = `<div class="re-item-details">
                        <span>חדרים: ${roomsText}</span>
                        <span>${sqmText}</span>
                    </div>`;
                } else {
                    // Yad2 has full structured data
                    detailsHtml = `<div class="re-item-details">
                        <span>חדרים: ${item.rooms ?? '\u2014'}</span>
                        <span>קומה: ${item.floor ?? '\u2014'}</span>
                        <span>${item.squareMeters ?? '\u2014'} מ"ר</span>
                    </div>`;
                }

                // Updated time - format based on source
                let updatedText = item.updatedAt || item.dateAdded || '\u2014';
                if (item.source === 'facebook' && updatedText !== '\u2014') {
                    updatedText = updatedText.split('T')[0]; // Just show date for FB
                }

                return `<div class="re-item">
                    <div class="re-item-info">
                        ${badgeHtml}
                        <div class="re-item-type">${item.estateType || item.title || 'נכס'}</div>
                        <div class="re-item-address">${street}${neighborhood}${settlement ? ', ' + settlement : ''}</div>
                        ${detailsHtml}
                        <div class="re-item-updated">עודכן: ${updatedText}</div>
                        ${tagsHtml}
                        ${statsHtml}
                        ${item.source === 'yad2' ? `<div id="ai-area-${item.linkToken}">
                            <button class="ai-btn" onclick="aiAnalyze('${item.linkToken}')">ניתוח AI</button>
                        </div>` : ''}
                    </div>
                    <div class="re-item-price-col">
                        <div class="re-price">${item.price || '\u2014'}</div>
                    </div>
                </div>`;
            }).join('');
        }

        async function aiAnalyze(token) {
            const area = document.getElementById('ai-area-' + token);
            if (!area) return;
            const btn = area.querySelector('.ai-btn');
            if (btn) { btn.disabled = true; btn.classList.add('loading'); btn.textContent = 'מנתח...'; }

            try {
                const res = await fetch('/api/realestate/analyze/' + encodeURIComponent(token));
                const data = await res.json();
                const sentimentLabel = {positive: 'חיובי', negative: 'שלילי', neutral: 'ניטרלי'};
                const s = data.sentiment || 'neutral';
                let html = `<span class="sentiment-badge ${s}">${sentimentLabel[s] || s}</span>`;
                if (data.confidence) html += ` <span style="font-size:0.6rem;color:#6b7280;">(${Math.round(data.confidence * 100)}%)</span>`;
                // Keywords hidden due to UTF-8 encoding issues with Hebrew
                // if (data.keywords && data.keywords.length) {
                //     html += '<div class="ai-keywords">' + data.keywords.map(k => `<span class="ai-keyword">${k}</span>`).join('') + '</div>';
                // }
                if (data.note) html += `<div style="font-size:0.6rem;color:#6b7280;margin-top:2px;">${data.note}</div>`;
                area.innerHTML = html;
            } catch (e) {
                area.innerHTML = '<span style="font-size:0.6rem;color:#ef4444;">שגיאה בניתוח</span>';
            }
        }

        // Deep Analysis
        async function deepAnalyze() {
            const input = document.getElementById('daInput').value.trim();
            const rooms = document.getElementById('daRooms').value;

            if (!input) {
                alert('יש להזין קישור למודעה או כתובת');
                return;
            }

            document.getElementById('daResults').innerHTML = '<div class="re-status loading"><div class="spinner"></div>מנתח נכס...</div>';
            document.getElementById('daInfoBar').innerHTML = '';

            try {
                const params = new URLSearchParams({ input, rooms });
                const res = await fetch('/api/realestate/deep-analysis?' + params);
                const data = await res.json();

                if (data.error) {
                    document.getElementById('daResults').innerHTML = `<div class="re-status" style="color:#ef4444;">${data.error}</div>`;
                    return;
                }

                displayDeepAnalysisResults(data);
            } catch (e) {
                document.getElementById('daResults').innerHTML = '<div class="re-status" style="color:#ef4444;">שגיאה בביצוע הניתוח</div>';
                console.error(e);
            }
        }

        function displayDeepAnalysisResults(data) {
            const resultsDiv = document.getElementById('daResults');

            let html = '<div class="deep-analysis-report" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,165,0,0.08); border-radius: 16px; padding: 24px; margin-top: 16px;">';

            // Property details
            html += '<div style="margin-bottom: 24px;">';
            html += '<h3 style="font-size: 1.3rem; font-weight: 700; color: #FF9500; margin-bottom: 12px;">פרטי הנכס</h3>';
            if (data.property) {
                html += `<p><strong>כתובת:</strong> ${data.property.address || 'לא זמין'}</p>`;
                html += `<p><strong>עיר:</strong> ${data.property.city || 'לא זמין'}</p>`;
                html += `<p><strong>שכונה:</strong> ${data.property.neighborhood || 'לא זמין'}</p>`;
                html += `<p><strong>חדרים:</strong> ${data.property.rooms || 'לא זמין'}</p>`;
                if (data.property.price) html += `<p><strong>מחיר מבוקש:</strong> ${data.property.price}</p>`;
                if (data.property.sqm) html += `<p><strong>שטח:</strong> ${data.property.sqm} מ"ר</p>`;
            }
            html += '</div>';

            // Historical transactions
            if (data.transactions && data.transactions.length > 0) {
                html += '<div style="margin-bottom: 24px;">';
                html += '<h3 style="font-size: 1.3rem; font-weight: 700; color: #FF9500; margin-bottom: 12px;">עסקאות קודמות באזור</h3>';
                html += `<p style="margin-bottom: 12px;">נמצאו ${data.transactions.length} עסקאות דומות</p>`;

                html += '<div style="display: grid; gap: 12px;">';
                data.transactions.slice(0, 10).forEach(tx => {
                    html += '<div style="background: rgba(255,255,255,0.02); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,165,0,0.05);">';
                    html += `<p><strong>תאריך:</strong> ${tx.date || 'לא זמין'}</p>`;
                    html += `<p><strong>מחיר:</strong> ${tx.price || 'לא זמין'}</p>`;
                    if (tx.address) html += `<p><strong>כתובת:</strong> ${tx.address}</p>`;
                    if (tx.rooms) html += `<p><strong>חדרים:</strong> ${tx.rooms}</p>`;
                    if (tx.sqm) html += `<p><strong>שטח:</strong> ${tx.sqm} מ"ר</p>`;
                    html += '</div>';
                });
                html += '</div>';
                html += '</div>';
            }

            // Statistics
            if (data.statistics) {
                html += '<div style="margin-bottom: 24px;">';
                html += '<h3 style="font-size: 1.3rem; font-weight: 700; color: #FF9500; margin-bottom: 12px;">סטטיסטיקה</h3>';
                const stats = data.statistics;
                if (stats.avgPrice) html += `<p><strong>מחיר ממוצע באזור:</strong> ${stats.avgPrice}</p>`;
                if (stats.avgPricePerSqm) html += `<p><strong>מחיר ממוצע למ"ר:</strong> ${stats.avgPricePerSqm}</p>`;
                if (stats.minPrice) html += `<p><strong>מחיר מינימלי:</strong> ${stats.minPrice}</p>`;
                if (stats.maxPrice) html += `<p><strong>מחיר מקסימלי:</strong> ${stats.maxPrice}</p>`;
                if (stats.medianPrice) html += `<p><strong>מחיר חציוני:</strong> ${stats.medianPrice}</p>`;
                html += '</div>';
            }

            // Insights
            if (data.insights) {
                html += '<div>';
                html += '<h3 style="font-size: 1.3rem; font-weight: 700; color: #FF9500; margin-bottom: 12px;">תובנות</h3>';
                html += `<p style="line-height: 1.6;">${data.insights}</p>`;
                html += '</div>';
            }

            // Note about data source
            if (data.note) {
                html += '<div style="margin-top: 24px; padding: 12px; background: rgba(255,165,0,0.1); border: 1px solid rgba(255,165,0,0.2); border-radius: 8px;">';
                html += `<p style="font-size: 0.85rem; color: #FFB347; line-height: 1.5;">ℹ️ ${data.note}</p>`;
                html += '</div>';
            }

            html += '</div>';
            resultsDiv.innerHTML = html;

            // Update info bar
            if (data.fetchTime) {
                const bar = document.getElementById('daInfoBar');
                bar.innerHTML = `<div class="re-info-bar">
                    <span>זמן שליפה: <span class="info-value">${data.fetchTime} שניות</span></span>
                    <span>מקור: <span class="info-value">${data.source || 'רשות המסים'}</span></span>
                </div>`;
            }
        }

        async function reSearch() {
            reStopRefresh();

            const dealType     = document.getElementById('reDealType').value;
            const neighborhood = locationSelect.getValue();
            const minPrice     = document.getElementById('reMinPrice').value || '0';
            const maxPrice     = document.getElementById('reMaxPrice').value || '10000000';
            const minSqm       = document.getElementById('reMinSqm').value;
            const maxSqm       = document.getElementById('reMaxSqm').value;

            // Get selected sources
            const sources = [];
            if (document.getElementById('sourceYad2').checked) sources.push('yad2');
            if (document.getElementById('sourceFacebook').checked) sources.push('facebook');

            if (sources.length === 0) {
                alert('יש לבחור לפחות מקור אחד');
                return;
            }

            document.getElementById('reResults').innerHTML = '<div class="re-status loading"><div class="spinner"></div>מחפש...</div>';
            document.getElementById('reInfoBar').innerHTML = '';

            try {
                // Resolve city from neighborhood map so Yad2 URL includes city filter
                const cities = neighborhoodCityMap[neighborhood] || [];
                const settlement = cities.length === 1 ? cities[0] : '';
                const params = new URLSearchParams({ dealType, settlement, minPrice, maxPrice });
                if (neighborhood) params.set('neighborhood', neighborhood);
                if (minSqm) params.set('minSqm', minSqm);
                if (maxSqm) params.set('maxSqm', maxSqm);
                params.set('sources', sources.join(','));

                const res = await fetch('/api/realestate/search?' + params);
                const data = await res.json();

                // Handle ambiguous neighborhood (multiple cities)
                if (res.status === 300 && data.cities) {
                    const city = prompt(`"${data.neighborhood}" נמצאת בכמה ערים:\n${data.cities.join('\n')}\n\nהקלד שם עיר:`);
                    if (!city) {
                        document.getElementById('reResults').innerHTML = '<div class="re-status">החיפוש בוטל</div>';
                        return;
                    }
                    params.set('settlement', city);
                    const res2 = await fetch('/api/realestate/search?' + params);
                    const data2 = await res2.json();
                    if (!res2.ok) throw new Error(data2.error || 'החיפוש נכשל');
                    reSearchId = data2.search_id;

                    reUpdateInfoBar(data2);
                    reRenderItems(data2.items);
                    return;
                }

                if (!res.ok) throw new Error(data.error || 'החיפוש נכשל');
                reSearchId = data.search_id;

                reUpdateInfoBar(data);
                reRenderItems(data.items);
            } catch (e) {
                document.getElementById('reResults').innerHTML = '<div class="re-status">שגיאה: ' + e.message + '</div>';
            }
        }

        async function reUpdate() {
            if (!reSearchId) return;
            try {
                const res = await fetch('/api/realestate/update?searchId=' + encodeURIComponent(reSearchId));
                const data = await res.json();
                if (!res.ok) return;

                reRenderItems(data.items);
            } catch (e) { /* silently ignore polling errors */ }
        }

        function reToggleRefresh() {
            const btn = document.getElementById('reRefreshBtn');
            if (reRefreshInterval) {
                reStopRefresh();
            } else {
                if (!reSearchId) { alert('יש להריץ חיפוש קודם'); return; }
                reRefreshInterval = setInterval(reUpdate, 10000);
                btn.textContent = 'רענון אוטומטי: פעיל';
                btn.classList.add('refresh-active');
            }
        }

        function reStopRefresh() {
            if (reRefreshInterval) { clearInterval(reRefreshInterval); reRefreshInterval = null; }
            const btn = document.getElementById('reRefreshBtn');
            btn.textContent = 'רענון אוטומטי: כבוי';
            btn.classList.remove('refresh-active');
        }

        async function reCancel() {
            reStopRefresh();
            if (reSearchId) {
                try {
                    await fetch('/api/realestate/cancel?searchId=' + encodeURIComponent(reSearchId), { method: 'DELETE' });
                } catch (e) { /* ignore */ }
                reSearchId = null;
            }
            document.getElementById('reResults').innerHTML = '<div class="re-status">החיפוש בוטל</div>';
            document.getElementById('reInfoBar').innerHTML = '';
        }

        // Particle background — orange/amber theme
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
        resize();
        addEventListener('resize', resize);

        for (let i = 0; i < 80; i++) {
            const hue = Math.random() > 0.5 ? 0 : 1;
            particles.push({
                x: Math.random() * innerWidth,
                y: Math.random() * innerHeight,
                r: Math.random() * 2 + 0.5,
                dx: (Math.random() - 0.5) * 0.4,
                dy: (Math.random() - 0.5) * 0.4,
                o: Math.random() * 0.35 + 0.08,
                hue: hue
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.hue === 0
                    ? `rgba(255,107,0,${p.o})`
                    : `rgba(255,179,71,${p.o})`;
                ctx.fill();
            });
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255,149,0,${0.06 * (1 - dist / 120)})`;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
