<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yad 1.5 — Smart Real Estate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #111827;
            color: #f9fafb;
            overflow-x: hidden;
            direction: rtl;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,107,0,0.35); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,107,0,0.55); }

        /* ── Header ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(17,24,39,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, #FF6B00, #FF9500, #FFB347) 1;
            padding: 16px 24px;
            text-align: center;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            direction: ltr;
        }
        .header .subtitle {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ── Container ── */
        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* ── Search Panel Card ── */
        .search-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,165,0,0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(8px);
        }

        /* ── Form ── */
        .re-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 130px;
        }
        .form-group label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .form-group select,
        .form-group input {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,165,0,0.15);
            background: rgba(255,255,255,0.06);
            color: #f9fafb;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            direction: rtl;
        }
        .form-group select:focus,
        .form-group input:focus {
            border-color: #FF6B00;
            box-shadow: 0 0 0 3px rgba(255,107,0,0.15);
        }
        .form-group select option {
            background: #1f2937;
            color: #f9fafb;
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.25); }
        .form-group input[type="number"] { direction: ltr; text-align: right; }

        /* ── Tom Select Dark Theme Override ── */
        .ts-wrapper { width: 100%; }
        .ts-wrapper .ts-control {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,165,0,0.15);
            background: rgba(255,255,255,0.06);
            color: #f9fafb;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            box-shadow: none;
            direction: rtl;
            min-height: 0;
        }
        .ts-wrapper .ts-control input { color: #f9fafb !important; }
        .ts-wrapper .ts-control input::placeholder { color: rgba(255,255,255,0.25) !important; }
        .ts-wrapper.focus .ts-control {
            border-color: #FF6B00;
            box-shadow: 0 0 0 3px rgba(255,107,0,0.15);
        }
        .ts-wrapper .ts-dropdown {
            background: #1f2937;
            border: 1px solid rgba(255,165,0,0.25);
            border-top: none;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            margin-top: 0;
        }
        .ts-wrapper .ts-dropdown .option {
            padding: 8px 14px;
            color: #f9fafb;
            font-size: 0.88rem;
        }
        .ts-wrapper .ts-dropdown .option:hover,
        .ts-wrapper .ts-dropdown .active {
            background: rgba(255,165,0,0.15);
            color: #f9fafb;
        }
        .ts-wrapper .ts-dropdown .ts-dropdown-content::-webkit-scrollbar { width: 6px; }
        .ts-wrapper .ts-dropdown .ts-dropdown-content::-webkit-scrollbar-thumb { background: rgba(255,165,0,0.3); border-radius: 3px; }
        .ts-wrapper .ts-control .item { color: #f9fafb; }

        /* ── Action Buttons ── */
        .re-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.search-btn {
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            color: white;
            min-width: 100px;
        }
        button.search-btn:hover {
            box-shadow: 0 4px 16px rgba(255,107,0,0.35);
            transform: translateY(-1px);
        }
        button.refresh-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,165,0,0.15);
            color: #9ca3af;
        }
        button.refresh-btn:hover {
            border-color: rgba(255,165,0,0.3);
            color: #f9fafb;
        }
        button.refresh-btn.refresh-active {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            border-color: transparent;
        }
        button.cancel {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #9ca3af;
        }
        button.cancel:hover {
            border-color: rgba(239,68,68,0.4);
            color: #ef4444;
        }

        /* ── Info Bar ── */
        .re-info-bar {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            padding: 10px 16px;
            margin-bottom: 12px;
            background: rgba(255,165,0,0.06);
            border: 1px solid rgba(255,165,0,0.1);
            border-radius: 10px;
            font-size: 0.78rem;
            color: #9ca3af;
        }
        .re-info-bar span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .re-info-bar .info-value {
            color: #FFB347;
            font-weight: 600;
        }

        /* ── Results ── */
        .re-results {
            max-height: 600px;
            overflow-y: auto;
            padding-left: 4px;
        }

        /* ── Listing Card ── */
        .re-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,165,0,0.06);
            border-right: 3px solid transparent;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 10px;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }
        .re-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            border-right-color: #FF6B00;
            background: rgba(255,255,255,0.06);
        }

        .re-item-info {
            flex: 1;
            min-width: 0;
        }
        .re-item-badges {
            margin-bottom: 6px;
            display: flex;
            gap: 6px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .badge.new { background: rgba(16,185,129,0.2); color: #10b981; }
        .badge.updated { background: rgba(59,130,246,0.2); color: #3b82f6; }

        .re-item-type {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f9fafb;
            margin-bottom: 2px;
        }
        .re-item-address {
            font-size: 0.82rem;
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .re-item-details {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .re-item-details span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .re-item-updated {
            font-size: 0.72rem;
            color: rgba(156,163,175,0.6);
        }

        .re-item-price-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .re-price {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6B00, #FF9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            direction: ltr;
        }

        /* ── Stats Bar ── */
        .re-stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .stat {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 500;
            background: rgba(255,255,255,0.06);
            color: #9ca3af;
            white-space: nowrap;
            direction: ltr;
        }
        .stat.deal-good {
            background: rgba(16,185,129,0.15);
            color: #10b981;
        }
        .stat.deal-bad {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
        }

        /* ── Status / Spinner ── */
        .re-status {
            text-align: center;
            color: #9ca3af;
            padding: 32px 12px;
            font-size: 0.9rem;
        }
        .re-status.loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255,107,0,0.15);
            border-top-color: #FF6B00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .form-row { flex-direction: column; }
            .re-item { flex-direction: column; }
            .re-item-price-col { align-items: flex-start; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>

    <header class="header">
        <h1>Yad 1.5</h1>
        <p class="subtitle">חיפוש נדל"ן חכם עם סינון מתקדם</p>
    </header>

    <div class="container">
        <div class="search-panel">
            <div class="re-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reDealType">סוג עסקה</label>
                        <select id="reDealType">
                            <option value="rent">השכרה</option>
                            <option value="forsale">מכירה</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:2; min-width: 220px;">
                        <label for="reLocation">מיקום (עיר, שכונה)</label>
                        <select id="reLocation" placeholder="הקלידו עיר או שכונה..."></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="reMinPrice">מחיר מינימום</label>
                        <input type="number" id="reMinPrice" placeholder="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="reMaxPrice">מחיר מקסימום</label>
                        <input type="number" id="reMaxPrice" placeholder="10,000" value="10000">
                    </div>
                    <div class="form-group">
                        <label for="reMinSqm">מ"ר מינימום</label>
                        <input type="number" id="reMinSqm" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="reMaxSqm">מ"ר מקסימום</label>
                        <input type="number" id="reMaxSqm" placeholder="ללא הגבלה">
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <label>&nbsp;</label>
                        <button class="search-btn" onclick="reSearch()">חיפוש</button>
                    </div>
                </div>
            </div>
            <div class="re-actions">
                <button id="reRefreshBtn" class="refresh-btn" onclick="reToggleRefresh()">רענון אוטומטי: כבוי</button>
                <button class="cancel" onclick="reCancel()">ביטול</button>
            </div>
        </div>

        <div id="reInfoBar"></div>

        <div id="reResults" class="re-results">
            <div class="re-status">הזינו קריטריונים ולחצו חיפוש</div>
        </div>
    </div>

    <script>
        let reSearchId = null;
        let reRefreshInterval = null;
        let reStatsScope = 'page';

        function reUpdateInfoBar(data) {
            const bar = document.getElementById('reInfoBar');
            if (!data || !data.items || data.items.length === 0) {
                bar.innerHTML = '';
                return;
            }
            const fetchTime = data.fetchTime != null ? data.fetchTime + ' שניות' : '\u2014';
            const totalItems = data.items.length;
            const avgCount = data.avgSampleCount || 0;
            const totalPages = data.total_pages || '\u2014';
            const scope = data.statsScope === 'city-wide' ? 'כלל העיר' : 'כל התוצאות';

            bar.innerHTML = `<div class="re-info-bar">
                <span>זמן שליפה: <span class="info-value">${fetchTime}</span></span>
                <span>תוצאות: <span class="info-value">${totalItems}</span></span>
                <span>עמודים שנסרקו: <span class="info-value">${Math.min(totalPages, 20)} / ${totalPages}</span></span>
                <span>ממוצע מחושב על: <span class="info-value">${avgCount} נכסים</span></span>
                <span>מקור: <span class="info-value">${scope}</span></span>
            </div>`;
        }

        // ── Tom Select — single (city, neighborhood) picker ──
        const SEP = ' > ';
        let locationSelect;
        let _loadingNeighborhoods = '';

        locationSelect = new TomSelect('#reLocation', {
            create: false,
            maxOptions: 150,
            sortField: { field: 'text', direction: 'asc' },
            optgroupField: 'group',
            optgroupLabelField: 'label',
            optgroupValueField: 'id',
            render: {
                optgroup_header(data) {
                    return '<div style="padding:6px 14px;font-size:0.72rem;font-weight:700;color:#FF9500;border-bottom:1px solid rgba(255,165,0,0.1);">' + data.label + '</div>';
                },
            },
            onChange(val) {
                // If a city (no SEP) is selected, load its neighborhoods
                if (val && !val.includes(SEP)) {
                    loadNeighborhoods(val);
                }
            },
        });

        // Load cities on page load
        (async function loadCities() {
            try {
                const res = await fetch('/api/cities');
                const cities = await res.json();
                locationSelect.addOptionGroup('cities', { label: 'ערים' });
                cities.forEach(c => locationSelect.addOption({ value: c, text: c, group: 'cities' }));
                locationSelect.refreshOptions(false);
            } catch (e) { /* ignore */ }
        })();

        // Fetch neighborhoods for a city and add as options
        async function loadNeighborhoods(city) {
            if (_loadingNeighborhoods === city) return;
            _loadingNeighborhoods = city;
            // Remove old neighborhood options
            Object.keys(locationSelect.options).forEach(key => {
                if (key.includes(SEP)) locationSelect.removeOption(key);
            });
            try {
                const res = await fetch(`/api/neighborhoods?city=${encodeURIComponent(city)}`);
                const neighborhoods = await res.json();
                if (neighborhoods.length) {
                    locationSelect.addOptionGroup('neighborhoods', { label: city + ' — שכונות' });
                    neighborhoods.forEach(n => {
                        const val = city + SEP + n;
                        locationSelect.addOption({ value: val, text: n, group: 'neighborhoods' });
                    });
                    locationSelect.refreshOptions(false);
                    // Re-open dropdown to show neighborhoods
                    locationSelect.open();
                }
            } catch (e) { /* ignore */ }
        }

        // After search, update neighborhoods (in case search returned more/different ones)
        function reUpdateNeighborhoodList(neighborhoods, city) {
            if (!neighborhoods || !neighborhoods.length || !city) return;
            locationSelect.addOptionGroup('neighborhoods', { label: city + ' — שכונות' });
            neighborhoods.forEach(n => {
                const val = city + SEP + n;
                if (!locationSelect.options[val]) {
                    locationSelect.addOption({ value: val, text: n, group: 'neighborhoods' });
                }
            });
            locationSelect.refreshOptions(false);
        }

        // Parse selected value into { city, neighborhood }
        function parseLocation() {
            const val = locationSelect.getValue();
            if (!val) return { city: '', neighborhood: '' };
            if (val.includes(SEP)) {
                const parts = val.split(SEP);
                return { city: parts[0], neighborhood: parts.slice(1).join(SEP) };
            }
            return { city: val, neighborhood: '' };
        }

        function reRenderItems(items) {
            const container = document.getElementById('reResults');
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="re-status">לא נמצאו תוצאות</div>';
                return;
            }
            const scopeLabel = reStatsScope === 'city-wide' ? '(כלל העיר)' : '(כל התוצאות)';
            container.innerHTML = items.map(item => {
                let badgeHtml = '';
                if (item.status === 'new') badgeHtml = '<div class="re-item-badges"><span class="badge new">חדש</span></div>';
                else if (item.status === 'updated') badgeHtml = '<div class="re-item-badges"><span class="badge updated">עודכן</span></div>';

                let statsHtml = '';
                if (item.pricePerSqm) {
                    const fmt = n => n ? n.toLocaleString() : '\u2014';
                    const avg = item.avgPricePerSqmNeighborhood || item.avgPricePerSqmCity;
                    let dealClass = '';
                    if (avg) dealClass = item.pricePerSqm <= avg ? 'deal-good' : 'deal-bad';
                    statsHtml = `<div class="re-stats">
                        <span class="stat ${dealClass}">${fmt(item.pricePerSqm)} /מ"ר</span>
                        ${item.avgPricePerSqmFiltered ? `<span class="stat">ממוצע מסונן: ${fmt(item.avgPricePerSqmFiltered)} /מ"ר</span>` : ''}
                        ${item.avgPricePerSqmNeighborhood ? `<span class="stat">ממוצע שכונה ${scopeLabel}: ${fmt(item.avgPricePerSqmNeighborhood)} /מ"ר</span>` : ''}
                        ${item.avgPricePerSqmCity ? `<span class="stat">ממוצע עיר ${scopeLabel}: ${fmt(item.avgPricePerSqmCity)} /מ"ר</span>` : ''}
                    </div>`;
                }

                const street = item.street || '';
                const neighborhood = item.neighborhood ? ', ' + item.neighborhood : '';
                const settlement = item.settlement || '';

                return `<div class="re-item">
                    <div class="re-item-info">
                        ${badgeHtml}
                        <div class="re-item-type">${item.estateType || 'נכס'}</div>
                        <div class="re-item-address">${street}${neighborhood}, ${settlement}</div>
                        <div class="re-item-details">
                            <span>חדרים: ${item.rooms ?? '\u2014'}</span>
                            <span>קומה: ${item.floor ?? '\u2014'}</span>
                            <span>${item.squareMeters ?? '\u2014'} מ"ר</span>
                        </div>
                        <div class="re-item-updated">עודכן: ${item.updatedAt || '\u2014'}</div>
                        ${statsHtml}
                    </div>
                    <div class="re-item-price-col">
                        <div class="re-price">${item.price || '\u2014'}</div>
                    </div>
                </div>`;
            }).join('');
        }

        async function reSearch() {
            reStopRefresh();

            const dealType     = document.getElementById('reDealType').value;
            const { city: settlement, neighborhood } = parseLocation();
            const minPrice     = document.getElementById('reMinPrice').value || '0';
            const maxPrice     = document.getElementById('reMaxPrice').value || '10000000';
            const minSqm       = document.getElementById('reMinSqm').value;
            const maxSqm       = document.getElementById('reMaxSqm').value;

            document.getElementById('reResults').innerHTML = '<div class="re-status loading"><div class="spinner"></div>מחפש...</div>';
            document.getElementById('reInfoBar').innerHTML = '';

            try {
                const params = new URLSearchParams({ dealType, settlement, minPrice, maxPrice });
                if (neighborhood) params.set('neighborhood', neighborhood);
                if (minSqm) params.set('minSqm', minSqm);
                if (maxSqm) params.set('maxSqm', maxSqm);
                const res = await fetch('/api/realestate/search?' + params);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'החיפוש נכשל');
                reSearchId = data.search_id;
                reStatsScope = data.statsScope || 'page';
                reUpdateInfoBar(data);
                reUpdateNeighborhoodList(data.neighborhoods, settlement);
                reRenderItems(data.items);
            } catch (e) {
                document.getElementById('reResults').innerHTML = '<div class="re-status">שגיאה: ' + e.message + '</div>';
            }
        }

        async function reUpdate() {
            if (!reSearchId) return;
            try {
                const res = await fetch('/api/realestate/update?searchId=' + encodeURIComponent(reSearchId));
                const data = await res.json();
                if (!res.ok) return;
                reStatsScope = data.statsScope || reStatsScope;
                reRenderItems(data.items);
            } catch (e) { /* silently ignore polling errors */ }
        }

        function reToggleRefresh() {
            const btn = document.getElementById('reRefreshBtn');
            if (reRefreshInterval) {
                reStopRefresh();
            } else {
                if (!reSearchId) { alert('יש להריץ חיפוש קודם'); return; }
                reRefreshInterval = setInterval(reUpdate, 10000);
                btn.textContent = 'רענון אוטומטי: פעיל';
                btn.classList.add('refresh-active');
            }
        }

        function reStopRefresh() {
            if (reRefreshInterval) { clearInterval(reRefreshInterval); reRefreshInterval = null; }
            const btn = document.getElementById('reRefreshBtn');
            btn.textContent = 'רענון אוטומטי: כבוי';
            btn.classList.remove('refresh-active');
        }

        async function reCancel() {
            reStopRefresh();
            if (reSearchId) {
                try {
                    await fetch('/api/realestate/cancel?searchId=' + encodeURIComponent(reSearchId), { method: 'DELETE' });
                } catch (e) { /* ignore */ }
                reSearchId = null;
            }
            document.getElementById('reResults').innerHTML = '<div class="re-status">החיפוש בוטל</div>';
            document.getElementById('reInfoBar').innerHTML = '';
        }

        // Particle background — orange/amber theme
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
        resize();
        addEventListener('resize', resize);

        for (let i = 0; i < 80; i++) {
            const hue = Math.random() > 0.5 ? 0 : 1;
            particles.push({
                x: Math.random() * innerWidth,
                y: Math.random() * innerHeight,
                r: Math.random() * 2 + 0.5,
                dx: (Math.random() - 0.5) * 0.4,
                dy: (Math.random() - 0.5) * 0.4,
                o: Math.random() * 0.35 + 0.08,
                hue: hue
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.hue === 0
                    ? `rgba(255,107,0,${p.o})`
                    : `rgba(255,179,71,${p.o})`;
                ctx.fill();
            });
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255,149,0,${0.06 * (1 - dist / 120)})`;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
